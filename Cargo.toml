[package]
name = "rzip"
version = "0.1.0"
edition = "2024"
description = "A simple command line tool to compress and decompress zip files"

[dependencies]
zip = { version = "8.6.0", features = ["deflate", "aes-crypto"] }
home = "0.5.12"
clap = { version = "4.6.6", features = ["derive"] }
open = "5.4.1"
tabled = { version = "0.21.0", features = ["ansi"] }
colored = "3.1.1"
glob = "0.3.4"
